name: Agent task
description: Plan an auditable Codex or Claude task before opening a PR.
title: "[Agent task] "
labels:
  - agent-task
body:
  - type: markdown
    attributes:
      value: |
        Use this template for Codex, Claude, or another agent-driven change.
        Keep task scope explicit and keep generated files inside this repository.
  - type: input
    id: agent
    attributes:
      label: Agent
      description: Which agent will work on this task?
      placeholder: Codex, Claude, or other
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the agent accomplish?
    validations:
      required: true
  - type: textarea
    id: allowed_files
    attributes:
      label: Allowed files or directories
      description: List the files/directories the agent may modify.
      placeholder: |
        AGENTS.md
        .github/
        scripts/
        tests/
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Include privacy, local path, MCP, global config, and dependency constraints.
      value: |
        - Keep all outputs inside this repository.
        - Do not write to global `.codex`, `.claude`, or `.agents`.
        - Do not commit personal email addresses, secrets, tokens, or local absolute paths.
        - Do not create or modify MCP configuration without explicit maintainer approval.
        - Do not run global install commands.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this task can be merged?
      value: |
        - PR links back to this issue.
        - CI passes.
        - Repository hygiene check passes.
        - Commit email check passes.
        - A maintainer reviews the PR.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety checks
      options:
        - label: This task does not require committing secrets, credentials, or private data.
          required: true
        - label: This task does not require writing outside the repository.
          required: true
        - label: Any external input files will be copied into the task folder before processing.
          required: false
