name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Check commit emails
        run: python scripts/check_commit_emails.py

      - name: Run tests
        run: python -m unittest discover -s tests
